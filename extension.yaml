manifest_version: 2
lifecycle:
  data_schema_version: 1
  data_migrations: []
extension_id: flowsteward.data-connector-mcp-toolbox-oceanbase
kind: tool_provider
version: "1.3.7"
release_stage: active
display_name: OceanBase
description: 'Connect OceanBase to Flow Steward for reusable Dataset queries and workflow-driven data
  changes over its MySQL-compatible interface. The Dataset connector tests access, inspects typed table
  schemas, validates saved SQL against selected resources, previews results, runs saved queries and infers
  their output schema. Use application lookups and reporting extracts to supply data to subsequent workflow
  steps while keeping Dataset queries read-only.


  A separate workflow action runs one INSERT, UPDATE or DELETE with named parameters and an optional parameter
  schema. Use it to save workflow output or change existing application records in the configured OceanBase
  database, subject to the server''s SQL support and the database user''s permissions. Parameter values
  are supplied separately from SQL, allowing reusable statements to accept different workflow inputs.


  Configure the host, port, database and user and store a nonempty password in secrets. This package targets
  OceanBase''s MySQL-compatible endpoint and does not provide an Oracle-mode interface. Reads return at
  most 100 rows and 480 KiB. SQL support is a restricted subset; schema administration, transaction scripts
  and database triggers are outside the connector''s operation set.'
vendor:
  name: Flow Steward
  support_url: https://github.com/Flow-Steward/ext-data-oceanbase/issues
  website_url: https://github.com/Flow-Steward/ext-data-oceanbase
listing:
  category: data
  tags:
  - database
  - dataset
  - oceanbase
  summary: Inspect OceanBase schemas, query read-only Datasets and run parameterized INSERT, UPDATE or
    DELETE workflow actions.
  description: 'Connect OceanBase to Flow Steward for reusable Dataset queries and workflow-driven data
    changes over its MySQL-compatible interface. The Dataset connector tests access, inspects typed table
    schemas, validates saved SQL against selected resources, previews results, runs saved queries and
    infers their output schema. Use application lookups and reporting extracts to supply data to subsequent
    workflow steps while keeping Dataset queries read-only.


    A separate workflow action runs one INSERT, UPDATE or DELETE with named parameters and an optional
    parameter schema. Use it to save workflow output or change existing application records in the configured
    OceanBase database, subject to the server''s SQL support and the database user''s permissions. Parameter
    values are supplied separately from SQL, allowing reusable statements to accept different workflow
    inputs.


    Configure the host, port, database and user and store a nonempty password in secrets. This package
    targets OceanBase''s MySQL-compatible endpoint and does not provide an Oracle-mode interface. Reads
    return at most 100 rows and 480 KiB. SQL support is a restricted subset; schema administration, transaction
    scripts and database triggers are outside the connector''s operation set.'
  setup_summary: Configure the OceanBase MySQL-compatible host, port, database and user in a project connection,
    and put the required password in secrets. Use the user identity expected by that endpoint; Oracle-mode
    connections are outside this package.
package:
  format: flow-steward-extension
  license: Apache-2.0
  includes_source: true
billing_mode: free
upgrade_notes: Database-specific setup and friendly names. Stable extension, connection and connector
  IDs are preserved.
screenshots:
- label: Overview
  description: OceanBase connection and query overview.
  path: ui/components/overview.yaml
features:
- tool
- dataset_connector
- action
- query
required_scopes:
- extension:invoke
machine_auth:
  service_account_key: svc_ext_data_connector_mcp_toolbox_oceanbase
  required_scopes:
  - extension:invoke
account_scope:
  scope_type: project
  description: OceanBase connections are project-scoped and use the configured database settings and credentials.
external_effects:
- operation_id: execute_write
  effect_kind: database_write
  channel: toolbox
  idempotency: required
  test_mode_behavior: suppress
schemas:
  config: schemas/config.schema.yaml
  secrets: schemas/secrets.schema.yaml
  subscriptions: schemas/subscriptions.schema.yaml
entrypoint:
  mode: subprocess
  command:
  - python3
  - main.py
health:
  command:
  - python3
  - health.py
  timeout_seconds: 5
ui_manifest: ui/ui_manifest.yaml
query_manifest: ui/queries/queries.yaml
action_manifest: ui/actions/actions.yaml
runtime:
  contract_version: extension_host_v2
  extension_contract_v2:
    connection_types:
    - connection_type_id: toolbox_sql_writer
      display_name: OceanBase connection
      description: Project connection for parameterized OceanBase workflow writes.
      config_schema:
        type: object
        title: OceanBase connection settings
        additionalProperties: false
        required:
        - prebuilt
        - host
        - port
        - database
        - user
        properties:
          prebuilt:
            type: string
            title: SQL interface
            enum: &id001
            - oceanbase
            default: oceanbase
            description: OceanBase SQL interface; this extension cannot select another database.
            const: oceanbase
            readOnly: true
          host:
            type: string
            title: Host
            minLength: 1
            description: OceanBase host.
          port:
            type: integer
            title: Port
            minimum: 1
            maximum: 65535
            description: OceanBase port.
          database:
            type: string
            title: Database
            minLength: 1
            description: OceanBase database.
          user:
            type: string
            title: User
            minLength: 1
            description: OceanBase user.
      secret_schema:
        type: object
        title: OceanBase credentials
        additionalProperties: false
        properties:
          password:
            type: string
            title: OceanBase password
            description: Password for the selected OceanBase user.
            minLength: 1
        required:
        - password
      capabilities:
        write_queries: true
      safety_profile:
        stores_secret_values: false
    dataset_connectors:
    - connector_id: toolbox_database
      connector_type_id: toolbox_database
      database_kind: database
      display_name: OceanBase database
      description: Read-only OceanBase schema introspection and saved query execution.
      source_kind: database
      source_extension_id: flowsteward.data-connector-mcp-toolbox-oceanbase
      source_extension_name: OceanBase
      source_provider: OceanBase
      query_language: sql
      access_mode: read_only
      runtime_kind: local_extension
      runtime_adapter_ref: extensions/flowsteward_data_connector_mcp_toolbox_oceanbase/main.py
      connector_catalog:
      - source_kind: oceanbase
        connector_type_id: toolbox_oceanbase
        display_name: OceanBase
        query_language: sql
        preset_config:
          prebuilt: oceanbase
      connection_schema:
        type: object
        title: OceanBase connection settings
        additionalProperties: false
        required:
        - prebuilt
        - host
        - port
        - database
        - user
        properties:
          prebuilt:
            type: string
            title: SQL interface
            enum: *id001
            default: oceanbase
            description: OceanBase SQL interface; this extension cannot select another database.
            const: oceanbase
            readOnly: true
          host:
            type: string
            title: Host
            description: OceanBase host.
          port:
            type: integer
            minimum: 1
            maximum: 65535
            title: Port
            description: OceanBase port.
          database:
            type: string
            title: Database
            description: OceanBase database.
          user:
            type: string
            title: User
            description: OceanBase user.
          env:
            type: object
            title: Advanced OceanBase environment
            additionalProperties: false
            properties:
              OCEANBASE_HOST:
                type: string
              OCEANBASE_PORT:
                type: string
              OCEANBASE_DATABASE:
                type: string
              OCEANBASE_USER:
                type: string
            description: Optional OceanBase source environment overrides only. Credentials belong in secrets.
      secret_schema:
        type: object
        title: OceanBase credentials
        additionalProperties: false
        properties:
          password:
            type: string
            title: OceanBase password
            description: Password for the selected OceanBase user.
            minLength: 1
          env:
            type: object
            title: Advanced OceanBase secret environment
            additionalProperties: false
            properties:
              OCEANBASE_PASSWORD:
                type: string
                minLength: 1
            description: Optional OceanBase password environment override.
        anyOf:
        - required:
          - password
        - required:
          - env
          properties:
            env:
              required:
              - OCEANBASE_PASSWORD
      capabilities:
        read_only: true
        test_connection: true
        schema_introspection: true
        validate_query: true
        preview_query: true
        execute_template: true
        infer_output_schema: true
        write_queries: false
        row_preview: true
      safety_profile:
        access_mode: read_only
        indexes_rows: false
        executes_write_queries: false
        requires_saved_template: true
      preview_support: true
      schema_refresh_support: true
    operation_manifest:
    - operation_id: execute_write
      display_name: 'SQL: Insert, update or delete rows'
      workflow_visible: true
      operation_kind: action
      category: database
      description: 'Write workflow results to OceanBase using one parameterized INSERT, UPDATE or DELETE.
        Select a OceanBase project connection with write permission. Example: save a processing result
        with INSERT INTO workflow_results (record_id, status) VALUES (:record_id, :status), then provide
        Parameters and a type for each named parameter. Use Dataset saved queries for read-only SELECTs.
        Test mode validates this action without writing; SQL syntax must be supported by the selected
        database.'
      connection_type_ids:
      - toolbox_sql_writer
      required_scopes:
      - extension:invoke
      inputs:
      - name: connection_ref
        value_type: connection_ref
        required: true
        display_name: OceanBase project connection
        description: Select an existing project connection for OceanBase, configured with the correct
          profile and credentials in connection secrets. Its database user needs permission to execute
          your statement.
      - name: sql
        value_type: text
        required: true
        display_name: SQL write statement
        description: Enter one INSERT, UPDATE or DELETE supported by the selected database. Bind values
          with :named placeholders, provide Parameters and declare every placeholder type. Use a Dataset
          saved query for SELECT reads.
      - name: params
        value_type: object
        required: false
        display_name: Parameters (JSON)
        description: 'Object containing a value for every :named SQL placeholder. Bind workflow values
          here rather than inserting them into SQL text. Example: {"record_id":1042,"status":"approved"}.'
      - name: param_schema
        value_type: object
        required: false
        display_name: Parameter types (JSON Schema)
        description: 'Declare a type for every :named SQL placeholder in properties, matching the Parameters
          object. Required when SQL uses parameters; omit only for SQL without placeholders. Supported
          types: string, integer, number, boolean and null.'
      outputs:
      - name: status
        value_type: text
      - name: rows
        value_type: array
      - name: returned_row_count
        value_type: integer
      result_fields:
      - result.status
      - result.rows
      - result.returned_row_count
      error_codes:
      - invalid_payload
      - write_outcome_unknown
    - operation_id: test_connection
      workflow_visible: false
      operation_kind: action
      description: Validate that the configured OceanBase database can list tables.
      required_scopes:
      - extension:invoke
      result_fields:
      - result.status
      - result.connector_id
      - result.metadata.toolbox_prebuilt
      error_codes:
      - invalid_config
      - not_found
      - permission_denied
      - connector_runtime_failed
      - unknown_action
    - operation_id: introspect_schema
      workflow_visible: false
      operation_kind: action
      description: Return a typed OceanBase schema snapshot.
      required_scopes:
      - extension:invoke
      result_fields:
      - result.schema_snapshot.schema_version
      - result.schema_snapshot.resources[].resource_id
      - result.schema_snapshot.resources[].columns[].name
      - result.schema_snapshot.resources[].indexes[].columns[]
      - result.resource_count
      error_codes:
      - invalid_config
      - not_found
      - permission_denied
      - connector_runtime_failed
      - unknown_action
    - operation_id: validate_query
      workflow_visible: false
      operation_kind: action
      description: Validate a saved read-only query template against dataset resource scope.
      required_scopes:
      - extension:invoke
      result_fields:
      - result.valid
      - result.read_only
      - result.referenced_resources[]
      error_codes:
      - invalid_config
      - connector_runtime_failed
      - unknown_action
    - operation_id: preview_query
      workflow_visible: false
      operation_kind: action
      description: Execute a bounded read-only preview for a validated query template.
      required_scopes:
      - extension:invoke
      result_fields:
      - result.rows[]
      - result.row_count
      - result.output_schema
      error_codes:
      - invalid_config
      - connector_runtime_failed
      - unknown_action
    - operation_id: execute_template
      workflow_visible: false
      operation_kind: action
      description: Execute a saved read-only query template with named parameters and runtime row limits.
      required_scopes:
      - extension:invoke
      result_fields:
      - result.rows[]
      - result.row_count
      - result.output_schema
      - result.truncated
      error_codes:
      - invalid_config
      - connector_runtime_failed
      - unknown_action
    - operation_id: infer_output_schema
      workflow_visible: false
      operation_kind: action
      description: Infer output schema from a bounded read-only preview of the query template.
      required_scopes:
      - extension:invoke
      result_fields:
      - result.output_schema
      error_codes:
      - invalid_config
      - connector_runtime_failed
      - unknown_action
    resource_query_manifest:
    - query_id: runtime_health
      cursor_mode: none
      description: Return extension runtime health.
      required_scopes:
      - extension:invoke
      result_fields:
      - result.status
      - result.extension_id
      error_codes:
      - unknown_query
      - connector_runtime_failed
    - query_id: supported_connectors
      cursor_mode: none
      description: Return the supported connector catalog for this extension.
      required_scopes:
      - extension:invoke
      result_fields:
      - result.connectors[].connector_type_id
      - result.connectors[].display_name
      - result.connectors[].database_kind
      - result.connectors[].source_provider
      - result.connectors[].access_mode
      error_codes:
      - unknown_query
      - connector_runtime_failed
    step_ui_manifest: contracts/step_ui_manifest.yaml
