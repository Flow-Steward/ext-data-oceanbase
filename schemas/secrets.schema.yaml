$schema: https://json-schema.org/draft/2020-12/schema
type: object
title: OceanBase credentials
additionalProperties: false
properties:
  password:
    type: string
    title: OceanBase password
    description: Password for the selected OceanBase user.
    minLength: 1
  env:
    type: object
    title: Advanced OceanBase secret environment
    additionalProperties: false
    properties:
      OCEANBASE_PASSWORD:
        type: string
        minLength: 1
    description: Optional OceanBase password environment override.
anyOf:
- required:
  - password
- required:
  - env
  properties:
    env:
      required:
      - OCEANBASE_PASSWORD
