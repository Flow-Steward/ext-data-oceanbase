$schema: https://json-schema.org/draft/2020-12/schema
type: object
title: OceanBase connection settings
additionalProperties: false
required:
- prebuilt
- host
- port
- database
- user
properties:
  prebuilt:
    type: string
    enum:
    - oceanbase
    title: SQL interface
    default: oceanbase
    description: OceanBase SQL interface; this extension cannot select another database.
    const: oceanbase
    readOnly: true
  host:
    type: string
    title: Host
    description: OceanBase host.
  port:
    type: string
    title: Port
    description: OceanBase port.
  database:
    type: string
    title: Database
    description: OceanBase database.
  user:
    type: string
    title: User
    description: OceanBase user.
  env:
    type: object
    title: Advanced OceanBase environment
    additionalProperties: false
    properties:
      OCEANBASE_HOST:
        type: string
      OCEANBASE_PORT:
        type: string
      OCEANBASE_DATABASE:
        type: string
      OCEANBASE_USER:
        type: string
    description: Optional OceanBase source environment overrides only. Credentials belong in secrets.
